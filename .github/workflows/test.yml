name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      TMPDIR: ${{ runner.temp }}
      QUANT_REPORT_TEST_TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline module and distribution tests
        run: |
          python -m unittest discover -s quant-data-kit/tests -q
          python -m unittest discover -s quant-strategy-kit/tests -q
          python -m unittest discover -s quant-report-kit/tests -q
          python -m unittest discover -s quant-rebalance-kit/tests -q
          python -m unittest discover -s tests -q
